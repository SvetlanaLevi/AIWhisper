name: Version alpha build

on:
  push:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: version-alpha-main
  cancel-in-progress: false

jobs:
  version:
    if: ${{ !contains(github.event.head_commit.message, '[skip version]') }}
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Calculate next alpha version
        id: version
        shell: bash
        run: |
          set -euo pipefail

          project="src/AIWhisper.Worker/AIWhisper.Worker.csproj"
          current_version="$(sed -n 's:.*<Version>\(.*\)</Version>.*:\1:p' "$project")"

          if [[ ! "$current_version" =~ ^([0-9]+\.[0-9]+\.[0-9]+)-alpha\.([0-9]+)$ ]]; then
            echo "Expected an alpha version in $project, found: $current_version" >&2
            exit 1
          fi

          base_version="${BASH_REMATCH[1]}"
          current_number="${BASH_REMATCH[2]}"
          latest_tag="$(git tag --list "v${base_version}-alpha.*" --sort=-version:refname | head -n 1)"
          tagged_number=0

          if [[ "$latest_tag" =~ ^v${base_version//./\.}-alpha\.([0-9]+)$ ]]; then
            tagged_number="${BASH_REMATCH[1]}"
          fi

          if (( tagged_number > current_number )); then
            current_number="$tagged_number"
          fi

          next_version="${base_version}-alpha.$((current_number + 1))"
          sed -i "s#<Version>${current_version}</Version>#<Version>${next_version}</Version>#" "$project"

          echo "version=$next_version" >> "$GITHUB_OUTPUT"
          echo "Next version: $next_version"

      - name: Test
        run: dotnet test tests/AIWhisper.Worker.Tests/AIWhisper.Worker.Tests.csproj

      - name: Commit version and create tag
        env:
          VERSION: ${{ steps.version.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/AIWhisper.Worker/AIWhisper.Worker.csproj
          git commit -m "chore: bump version to ${VERSION} [skip version]"
          git tag -a "v${VERSION}" -m "AIWhisper ${VERSION}"
          git push origin HEAD:main --follow-tags
